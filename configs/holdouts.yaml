# Holdout declarations — human-owned. Editing this file (adding, unsealing,
# moving or re-dating a holdout) is the protected action "change_locked_holdout"
# (hedge_fund/research/pipeline.py): a reviewed commit by a person, never an
# automated or AI edit. The file hash is pinned in every Phase B research
# manifest. Enforcement: hedge_fund/validation/holdout_guard.py.
#
# status
#   sealed        nobody reads market data in [start - embargo, end] except one
#                 human-opened holdout evaluation per candidate
#   contaminated  results on this window have been seen; it may never be
#                 declared or evaluated as a holdout again (development use only)
#   consumed      a sealed holdout whose evaluations are finished
#
# evaluation_mode
#   one_shot      (default) one human-opened read of the whole window per candidate
#   forward       never read as a window: the forward paper evaluator observes one
#                 session at a time as real calendar time reaches it
holdouts:
  - id: phase-a-2023
    start: "2023-02-01"
    end: "2026-06-30"
    embargo_days: 30
    status: contaminated
    reason: >-
      Phase A (runs/real-market-phase-a, preregistration b37d3f1b...) evaluated
      tsmom, xsmom, meanrev and breakout on this window and the results were
      read. It is in-sample knowledge from now on.

  - id: phase-b-prospective
    start: "2026-10-01"
    end: "2027-09-30"
    embargo_days: 30
    status: sealed
    evaluation_mode: forward
    reason: >-
      Every completed session before 2026-10-01 has either been seen (Phase A
      holdout) or sits inside the development history, so the only
      uncontaminated time holdout is prospective. Sealed on 2026-10-01 before
      any of its data existed. Data from 2026-09-01 (embargo) onward is
      fenced off from development, selection, optimization, dashboards and
      agents. Proposed by the research tooling; any change requires a human.
      Access modes (dates unchanged, per human instruction of 2026-10-01):
      research mode has zero access; forward paper evaluation reads one
      session at a time as real time reaches it, for a configuration frozen
      before its first observation (hedge_fund/validation/forward.py).

  - id: active-crypto-final
    start: "2025-09-01"
    end: "2026-08-31"
    embargo_days: 0
    status: sealed
    evaluation_mode: one_shot
    markets: [crypto]
    reason: >-
      Final out-of-sample year for the active-trading crypto plan (plan_crypto_v1,
      hash 252051415d0c2228). Sealed on 2026-10-03 by explicit owner instruction,
      before any research run read it. Development stops at 2025-08-31. The window
      overlaps the contaminated phase-a-2023 window by date only: Phase A evaluated
      US equities, and no crypto data or crypto result from this window has been seen.
      Scoped to crypto: it fences every crypto read (and any reader whose market is
      unknown); stock/SEC readers are unaffected.
