# docker compose -f deploy/docker-compose.yml up -d --build      (from the repository root)
services:
  paper:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped            # the supervisor restarts the node; Docker restarts the supervisor
    env_file: [paper.env]              # only AIHF_PAPER_* testnet/demo keys (empty for sandbox)
    volumes: ["aihf-data:/data"]       # journal, state (kill switch, HALT latches), snapshots, logs
    stop_grace_period: 60s
    healthcheck:                       # heartbeat.json is rewritten every 10 s by the monitor actor
      test: ["CMD", "python", "-c", "import json,time,sys,glob; f=glob.glob('/data/cache/paper/**/heartbeat.json', recursive=True); sys.exit(0 if f and time.time()-json.load(open(f[0]))['wall']<120 else 1)"]
      interval: 60s
      retries: 3
  dashboard:                           # docker compose run --rm dashboard   (read-only view)
    build: {context: .., dockerfile: deploy/Dockerfile}
    entrypoint: ["python", "-m", "hedge_fund.paper.dashboard", "/data/cache/paper/futures"]
    volumes: ["aihf-data:/data:ro"]
    profiles: ["tools"]
volumes:
  aihf-data: {}
